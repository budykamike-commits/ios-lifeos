workflows:
  ios-unsigned:
    name: Build Unsigned IPA
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Init Capacitor iOS
        script: |
          mkdir -p www && echo "<h1>Life OS</h1>" > www/index.html
          npm install
          npx cap add ios
          npx cap sync ios
      - name: Build Unsigned .ipa
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r LifeOS-unsigned.ipa Payload
    artifacts:
      - LifeOS-unsigned.ipa
